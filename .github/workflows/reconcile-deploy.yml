# =============================================================================
# reconcile-deploy: notice when production has drifted behind main, and fix it.
#
# The pipeline has several ways to leave main deployed-but-not-really:
#   * a merge GitHub performed itself (queued native auto-merge), which starts no
#     workflow run because GITHUB_TOKEN caused it;
#   * a deploy that failed halfway and nobody watched;
#   * a direct push to main by an admin, which bypasses the PR path entirely;
#   * a container the host restarted onto an older image.
#
# Rather than trying to plug each hole, this asks the only question that matters
# -- is the SHA running on EC2 the SHA at the head of main? -- and redeploys when
# the answer is no. It is a reconciler, not another trigger, so it also serves as
# the honest answer to "is production actually up to date?".
#
# Runs hourly, and can be run by hand. Reports without acting when `check_only`.
# =============================================================================

name: reconcile-deploy

on:
  schedule:
    - cron: "17 * * * *"     # hourly, off the hour to dodge the rush
  workflow_dispatch:
    inputs:
      check_only:
        description: "Report drift without redeploying"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write             # dispatches deploy-rideiq

concurrency:
  group: reconcile-deploy
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: What does main say?
        id: want
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: What is actually running?
        id: have
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Without this the step's stdout output comes back empty, and the
          # comparison below then reads "" != <sha> as drift on every single run
          # -- an hourly redeploy of production, forever.
          capture_stdout: true
          # The live container is whichever colour exists; its image tag carries
          # the commit as sha-<full>. The marker makes the value greppable out of
          # the action's own chatter instead of guessing at line positions.
          script: |
            for c in rideiq-blue rideiq-green; do
              if docker ps -q -f "name=^${c}$" | grep -q .; then
                sha=$(docker inspect --format '{{index .Config.Image}}' "$c" \
                        | sed 's/.*:sha-//')
                echo "DEPLOYED_SHA=${sha}"
                exit 0
              fi
            done
            echo "DEPLOYED_SHA=none"

      - name: Compare and act
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANT: ${{ steps.want.outputs.sha }}
          HAVE: ${{ steps.have.outputs.stdout }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          have=$(printf '%s\n' "$HAVE" | tr -d '\r' \
                 | sed -n 's/^DEPLOYED_SHA=//p' | tail -1)
          echo "main:     $WANT"
          echo "deployed: ${have:-<could not read>}"

          # An unreadable answer is not the same as drift. Redeploying because we
          # failed to ask the question is how a reconciler becomes a loop.
          if [ -z "$have" ]; then
            echo "::error::Could not read the deployed SHA from the host."
            exit 1
          fi

          if [ "$have" = "$WANT" ]; then
            echo "In sync."
            exit 0
          fi

          if [ "$have" = "none" ]; then
            echo "::warning::No RideIQ container is running on the host at all."
          fi

          echo "::warning::Production is not at main ($have vs $WANT)."
          if [ "$CHECK_ONLY" = "true" ]; then
            echo "check_only set -- not redeploying."
            exit 0
          fi
          gh workflow run deploy-rideiq.yml --ref main
          echo "Dispatched deploy-rideiq to bring production back to main."
