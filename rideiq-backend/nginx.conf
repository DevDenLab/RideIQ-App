# nginx.conf — load balancer in front of the RideIQ API replicas.
events { worker_connections 1024; }
http {
    upstream rideiq_api {
        server api1:8000;
        server api2:8000;
    }
    server {
        listen 80;
        location / {
            proxy_pass         http://rideiq_api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }
        location /health { proxy_pass http://rideiq_api/health; }
    }
}
