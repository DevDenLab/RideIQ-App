# =============================================================================
# auto-merge: land a green PR and then kick off the deploy.
#
# WHY THIS IS NOT GitHub's native auto-merge
# ------------------------------------------
# Native auto-merge works -- it merged PR #2 on its own. The problem is what
# happens next: nothing. GitHub does not start workflow runs from events caused
# by GITHUB_TOKEN, so a bot-performed merge lands on main and deploy-rideiq never
# fires. That is worse than a manual merge, because the pipeline LOOKS automatic
# right up until you notice production is several commits behind.
#
# `workflow_dispatch` is one of exactly two documented exceptions to that rule.
# So this workflow does the merge itself and then explicitly dispatches the
# deploy, which is the only way to close the loop without a personal access
# token (a PAT would work, but it is a manual step with an expiry date attached).
#
# HOW IT DECIDES
# --------------
# It runs after ci finishes, reads that run's conclusion, and refuses to merge
# unless it was a success. It does not form its own opinion about whether the
# code is good -- branch protection on main is still the authority, and the merge
# call fails if any required check is missing.
#
# Not merged: draft PRs, and PRs labelled `hold`.
# =============================================================================

name: auto-merge

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: write         # perform the merge
  pull-requests: write    # read and merge the PR
  actions: write          # dispatch deploy-rideiq

jobs:
  merge:
    # A red ci must never reach the merge call.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Find the pull request this ci run belongs to
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          # A ci run on a branch with no open PR (or a push straight to main) is
          # simply nothing to do, not an error.
          num=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
                  --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            echo "No open PR for $BRANCH -- nothing to merge."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true"   >> "$GITHUB_OUTPUT"
          echo "number=$num"  >> "$GITHUB_OUTPUT"

      - name: Check it is eligible
        id: eligible
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ steps.pr.outputs.number }}
        run: |
          data=$(gh pr view "$NUM" --repo "$REPO" --json isDraft,labels,mergeStateStatus)
          echo "$data"
          draft=$(echo "$data" | jq -r '.isDraft')
          held=$(echo "$data"  | jq -r '[.labels[].name] | index("hold") != null')
          if [ "$draft" = "true" ] || [ "$held" = "true" ]; then
            echo "PR #$NUM is draft or on hold -- leaving it."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge
        id: merge
        if: steps.eligible.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ steps.pr.outputs.number }}
        run: |
          # Squash so main reads as one change per PR. --auto is the fallback:
          # if some other required check is still running, GitHub queues it
          # rather than failing here (that queued merge will not dispatch the
          # deploy -- reconcile-deploy.yml is what covers that case).
          if gh pr merge "$NUM" --repo "$REPO" --squash --delete-branch; then
            echo "Merged PR #$NUM"
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Direct merge refused; queueing native auto-merge instead."
            gh pr merge "$NUM" --repo "$REPO" --squash --auto --delete-branch || true
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the merge
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The explicit dispatch that closes the loop. Without this the merge
          # above is invisible to Actions and production silently drifts behind.
          gh workflow run deploy-rideiq.yml --ref main
          echo "Dispatched deploy-rideiq against main."
