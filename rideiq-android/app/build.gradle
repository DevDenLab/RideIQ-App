plugins {
    id 'com.android.application'
}


// Resolve the API key from, in order: -PrideiqApiKey=..., a gradle property, then
// local.properties. That last one needs reading BY HAND: Gradle uses
// local.properties for sdk.dir and does not expose its contents as project
// properties, so project.findProperty("rideiqApiKey") is always null there. That
// mistake compiled an empty key into the APK and every call came back 401.
def rideiqApiKey = ""
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    def localProps = new Properties()
    localPropsFile.withInputStream { localProps.load(it) }
    rideiqApiKey = localProps.getProperty("rideiqApiKey", "")
}
if (project.hasProperty("rideiqApiKey")) {
    rideiqApiKey = project.property("rideiqApiKey")
}

android {
    namespace 'com.example.rideiq'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.rideiq"
        minSdk 24
        targetSdk 34

        // Supplied at build time; empty in CI, which is fine because the backend
        // only enforces the key when API_KEY is set on the server.
        buildConfigField "String", "RIDEIQ_API_KEY", "\"${rideiqApiKey}\""

        versionCode 1
        versionName "1.0"
    }
    buildFeatures {
        buildConfig true      // AGP 8 no longer generates BuildConfig by default
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // JVM unit tests. TransitProgress is deliberately plain Java with no Android
    // imports, so the logic that decides "when do I tell someone to get off" runs
    // on a normal JVM in milliseconds -- no emulator, no instrumentation.
    testImplementation 'junit:junit:4.13.2'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Free, zoomable OpenStreetMap map view — no API key.
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
