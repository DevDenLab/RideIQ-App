# docker-compose.yml — RideIQ full stack.
#
#   Android app → nginx (LB :8080) → api1 / api2 (FastAPI, 15 ML models) → redis (cache)
#                                          └──────────────────────────────→ sqlite (DB)
#
# Start:  docker compose up --build
# Docs:   http://localhost:8080/docs
# Quote:  curl -X POST localhost:8080/quote -H "Content-Type: application/json" \
#              -d '{"distance":12,"hour":18,"weather":1,"traffic":0.8,"surge":2.2}'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api1:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - INSTANCE_ID=api-1
      - DB_PATH=/data/rideiq.db
    volumes:
      - dbdata:/data
    depends_on: [redis]

  api2:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - INSTANCE_ID=api-2
      - DB_PATH=/data/rideiq.db
    volumes:
      - dbdata:/data
    depends_on: [redis]

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api1, api2]

volumes:
  dbdata:
