# =============================================================================
# build-city-graph: regenerate rideiq-backend/city_graph.json from OpenStreetMap.
#
# Run this MANUALLY (Actions tab -> "build-city-graph" -> Run workflow) whenever you
# want to refresh the road network or switch cities. It runs in the cloud (has internet
# + installs osmnx just for this job), then commits the new graph back to main — which
# automatically triggers deploy-rideiq to ship it. No local run, no osmnx in the app image.
#
# Why manual, not on every deploy: the map rarely changes, osmnx is heavy, and each run
# downloads the whole city from OSM (slow, and Overpass can rate-limit). Keeping it a
# one-click job keeps normal deploys fast and reliable.
# =============================================================================

name: build-city-graph

on:
  workflow_dispatch:
    inputs:
      place:
        description: "OSM place to build (e.g. 'Edmonton, Canada')"
        required: true
        default: "Edmonton, Canada"

permissions:
  contents: write        # needs to commit the regenerated graph back

jobs:
  build-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install osmnx (build-only dependency)
        run: pip install osmnx matplotlib

      - name: Build the city graph
        working-directory: rideiq-backend
        run: python build_city_graph.py "${{ github.event.inputs.place }}"

      - name: Commit the regenerated graph (triggers deploy-rideiq)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rideiq-backend/city_graph.json rideiq-backend/city_preview.png
          if git diff --cached --quiet; then
            echo "Graph unchanged — nothing to commit."
          else
            git commit -m "chore: rebuild city graph for '${{ github.event.inputs.place }}' [auto]"
            git push
          fi
