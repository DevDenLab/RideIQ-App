# =============================================================================
# ci: the gate everything else hangs off.
#
# This runs on every pull request and every push to main. auto-merge waits for
# it, and branch protection requires it, so a red run here is what stops broken
# code reaching EC2 -- deploy-rideiq ships to production on every merge.
#
# It is mostly a SMOKE test, and what it proves is worth stating plainly: the
# backend imports and serves, the app compiles, the workflows lint, and
# transit_client's pure functions behave. Coverage beyond that is nil -- nothing
# here exercises the Android UI, the OTP integration, or any endpoint's
# behaviour beyond a status code. Treat a green tick as "nothing is obviously
# broken", not "this works".
#
# Widening it is the highest-value thing anyone can do to this repo.
# =============================================================================

name: ci

on:
  pull_request:
  # Not `push: main`. deploy-rideiq calls this as a gate before it ships, so a
  # push trigger here would run the same checks twice and still not block the
  # deploy. One run, in the place where it can actually stop something.
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a PR makes the previous run pointless -- cancel it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend boots and serves
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rideiq-backend/requirements.txt

      - name: Install dependencies
        working-directory: rideiq-backend
        run: pip install -r requirements.txt

      - name: Boot the API and exercise it
        working-directory: rideiq-backend
        run: |
          # Importing app.py trains 15 ML models, which takes ~20s. Give the
          # server room for that before deciding it failed to start.
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 60); do
            curl -sf -m 2 http://127.0.0.1:8000/health >/dev/null && break
            sleep 2
          done
          curl -sf -m 5 http://127.0.0.1:8000/health || { echo "API never came up"; exit 1; }

          echo "--- health ---";   curl -s http://127.0.0.1:8000/health;   echo
          echo "--- pipeline ---"; curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/pipeline
          echo "--- openapi ---";  curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/openapi.json

          echo "--- quote ---"
          curl -sf -X POST http://127.0.0.1:8000/quote -H 'Content-Type: application/json' \
            -d '{"distance":12,"hour":18,"weather":1,"traffic":0.8,"surge":2.2}' \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['eta_min']>0 and d['fare_usd']>0, d; print('ok', d['eta_min'], d['fare_usd'])"

          echo "--- drive route on the committed city graph ---"
          curl -sf -X POST http://127.0.0.1:8000/route-latlon -H 'Content-Type: application/json' \
            -d '{"lat1":53.5444,"lon1":-113.4909,"lat2":53.5232,"lon2":-113.5263,"mode":"drive"}' \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['polyline_latlon'], 'no geometry'; print('ok', d['distance_km'], 'km')"

          # No OTP in CI, so this MUST degrade to 503 rather than 500 or hang.
          # That contract is what lets the app fall back to the Maps handoff.
          echo "--- transit degrades cleanly without an engine ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 \
            "http://127.0.0.1:8000/transit?lat1=53.5444&lon1=-113.4909&lat2=53.5232&lon2=-113.5263")
          echo "status $code"
          [ "$code" = "503" ] || { echo "expected 503 with no OTP, got $code"; exit 1; }

          # Autocomplete must be answered from the committed gazetteer, not from
          # Nominatim. If places.json goes missing this still returns results --
          # by falling back to the network, slowly and against their usage policy
          # -- so asserting on the SOURCE is the only check that catches it.
          echo "--- autocomplete is served locally ---"
          curl -sf -m 5 "http://127.0.0.1:8000/search?q=churchill" \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('source')=='local', d; assert len(d['results'])>=3, d; print('ok', len(d['results']), 'local results')"

          echo "--- the gazetteer actually loaded ---"
          curl -sf -m 5 http://127.0.0.1:8000/health \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['places']['loaded'], d; assert d['places']['entries']>5000, d; print('ok', d['places']['entries'], 'places')"

          # Ranking, not just presence. "34 ave" contains a word starting "34"
          # and a word starting "ave", so dozens of cross streets match it as
          # well as 34 Avenue does -- ordering is the whole feature.
          echo "--- autocomplete ranks by word order ---"
          curl -sf -m 5 --get --data-urlencode "q=34 ave" http://127.0.0.1:8000/search \
            | python -c "import json,sys; d=json.load(sys.stdin); top=d['results'][0]['display_name']; assert top.lower().startswith('34 avenue'), top; print('ok', top)"

          # The breaker must be reported and, with no OTP behind us, must trip.
          # The transit call above already failed once; a few more open it.
          echo "--- the OTP circuit breaker trips and then fails fast ---"
          for i in 1 2 3 4 5 6; do
            curl -s -o /dev/null -m 30 \
              "http://127.0.0.1:8000/transit?lat1=53.5444&lon1=-113.4909&lat2=53.5232&lon2=-113.526$i" || true
          done
          curl -sf -m 5 http://127.0.0.1:8000/resilience \
            | python -c "import json,sys; d=json.load(sys.stdin)['opentripplanner']; assert d['breaker']['state']=='open', d; print('ok breaker', d['breaker']['state'], 'after', d['breaker']['failures'], 'failures')"

          # Once open it must answer in milliseconds, not by waiting out a
          # 20-second timeout again. That speed IS the feature.
          echo "--- an open breaker answers immediately, with Retry-After ---"
          out=$(curl -s -o /dev/null -m 10 -w '%{http_code} %{time_total}' \
            "http://127.0.0.1:8000/transit?lat1=53.5444&lon1=-113.4909&lat2=53.5232&lon2=-113.5299")
          echo "  $out"
          python - "$out" <<'ASSERT'
          import sys
          code, secs = sys.argv[1].split()
          assert code == "503", "expected 503, got " + code
          assert float(secs) < 1.0, "open breaker took %ss -- it is not failing fast" % secs
          print("ok, 503 in %ss" % secs)
          ASSERT
          curl -s -D - -o /dev/null -m 10 \
            "http://127.0.0.1:8000/transit?lat1=53.5444&lon1=-113.4909&lat2=53.5232&lon2=-113.5298" \
            | grep -qi '^retry-after:' || { echo "no Retry-After on a shed request"; exit 1; }
          echo "  Retry-After present"

          # A fresh deployment has no outcomes, and must say so rather than
          # reporting a model comparison it cannot support.
          echo "--- the feedback loop is honest about having no data ---"
          curl -sf -m 5 http://127.0.0.1:8000/training-data \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['ready_to_train'] is False, d; print('ok', d['usable_for_training'], 'of', d['needed'])"
          curl -sf -m 5 http://127.0.0.1:8000/shadow-report \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['accuracy'] is None, d; print('ok, names no winner without outcomes')"

          # And the loop closes: a served route hands back an id, and an outcome
          # reported against that id becomes training data.
          echo "--- prediction -> outcome -> training data ---"
          # Asserted as a DELTA, not an absolute count. Pinning the total to 1
          # made this depend on every other request the script had already made
          # and on any database left behind by a previous run -- which is exactly
          # how it failed the first time it was run against a real server.
          before=$(curl -sf -m 5 http://127.0.0.1:8000/training-data \
            | python -c "import json,sys; print(json.load(sys.stdin)['usable_for_training'])")
          qid=$(curl -sf -X POST http://127.0.0.1:8000/route-latlon -H 'Content-Type: application/json' \
            -d '{"lat1":53.5444,"lon1":-113.4909,"lat2":53.5232,"lon2":-113.5263,"hour":8}' \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('quote_id'), 'no quote_id on a served route'; print(d['quote_id'])")
          curl -sf -X POST http://127.0.0.1:8000/trip-outcome -H 'Content-Type: application/json' \
            -d "{\"quote_id\": $qid, \"actual_min\": 24.5}" > /dev/null
          after=$(curl -sf -m 5 http://127.0.0.1:8000/training-data \
            | python -c "import json,sys; print(json.load(sys.stdin)['usable_for_training'])")
          echo "  usable_for_training: $before -> $after"
          [ "$after" = "$((before + 1))" ] || { echo "reporting an outcome added no training data"; exit 1; }
          echo "  ok, the loop is closed"

          # An outcome nothing can be attributed to must be refused, not counted.
          echo "--- an unattributable outcome is refused ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/trip-outcome \
            -H 'Content-Type: application/json' -d '{"quote_id": 999999, "actual_min": 20}')
          [ "$code" = "404" ] || { echo "expected 404 for an unknown quote_id, got $code"; exit 1; }
          echo "  ok, 404"

      - name: Unit tests
        working-directory: rideiq-backend
        # Covers transit_client, the k-d tree, the autocomplete trie, the circuit
        # breaker and the ML feedback loop. discover picks up new files, so
        # adding tests/test_*.py is enough to gate them.
        run: python -m unittest discover -s tests -v

      - name: API key gate
        working-directory: rideiq-backend
        env:
          API_KEY: ci-test-key
        run: |
          # Boot a second instance WITH a key set, and prove the gate both blocks
          # and lets through. The first instance above runs without a key, which is
          # the other half of the contract: unset API_KEY must disable the check so
          # local development stays frictionless.
          python -m uvicorn app:app --host 127.0.0.1 --port 8097 &
          for _ in $(seq 1 60); do
            curl -sf -m 2 http://127.0.0.1:8097/health >/dev/null && break
            sleep 2
          done
          check() {
            got=$(curl -s -o /dev/null -w '%{http_code}' "${@:3}")
            echo "  $1 -> $got (want $2)"
            [ "$got" = "$2" ] || { echo "FAILED: $1"; exit 1; }
          }
          check "health, no key"  200 http://127.0.0.1:8097/health
          check "docs, no key"    200 http://127.0.0.1:8097/docs
          check "quote, no key"   401 -X POST http://127.0.0.1:8097/quote -H 'Content-Type: application/json' -d '{"distance":5}'
          check "quote, bad key"  401 -X POST http://127.0.0.1:8097/quote -H 'X-API-Key: nope' -H 'Content-Type: application/json' -d '{"distance":5}'
          check "quote, good key" 200 -X POST http://127.0.0.1:8097/quote -H 'X-API-Key: ci-test-key' -H 'Content-Type: application/json' -d '{"distance":5}'

  android:
    name: android app compiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Unit tests before the build: they run in seconds on a plain JVM and catch
      # the logic errors that compiling never will. Until now "android app
      # compiles" was the entire Android quality gate.
      - name: Unit tests
        working-directory: rideiq-android
        run: ./gradlew testDebugUnitTest --console=plain --no-daemon

      - name: assembleDebug
        working-directory: rideiq-android
        run: ./gradlew assembleDebug --console=plain --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report-${{ github.sha }}
          path: rideiq-android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: rideiq-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  workflows:
    name: workflows are valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Both CI bugs shipped this month were workflow bugs that only surfaced on
      # a real run: a missing permission scope and a missing buildx setup step.
      # actionlint catches that class statically, in seconds.
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: The committed gazetteer is well formed
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("rideiq-backend/places.json", encoding="utf-8"))
          entries = d.get("entries") or []
          assert len(entries) > 5000, "only %d places" % len(entries)
          assert d["count"] == len(entries), "count disagrees with the data"
          kinds = {}
          for e in entries:
              for k in ("n", "y", "x", "k", "w"):
                  assert k in e, "entry missing %s: %r" % (k, e)
              assert 52.5 < e["y"] < 54.5 and -115 < e["x"] < -112, \
                  "coordinate outside Edmonton: %r" % e
              kinds[e["k"]] = kinds.get(e["k"], 0) + 1
          assert kinds.get("stop", 0) > 3000, kinds
          print("ok", len(entries), "places:", kinds)
          PY

      - name: Config files parse
        run: |
          python - <<'PY'
          import json, glob, sys
          # OTP allows // comments in its config; strip them before parsing.
          def strip(text):
              return "\n".join(l for l in text.splitlines()
                               if not l.lstrip().startswith("//"))
          bad = 0
          for f in glob.glob("rideiq-backend/transit/otp-config/*.json"):
              try:
                  json.loads(strip(open(f, encoding="utf-8").read()))
                  print("ok  ", f)
              except Exception as e:
                  print("FAIL", f, e); bad = 1
          sys.exit(bad)
          PY
